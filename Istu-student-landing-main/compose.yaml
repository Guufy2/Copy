name: istu-student-help
services:
  directus:
    image: directus/directus:11.17.4
    ports:
      - '127.0.0.1:8055:8055'
    volumes:
      - directus11_database:/directus/database
      - directus11_uploads:/directus/uploads
    environment:
      SECRET: ${DIRECTUS_SECRET:?Run npm run cms:init-env first}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?Run npm run cms:init-env first}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?Run npm run cms:init-env first}
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db
      PUBLIC_URL: http://127.0.0.1:8055
      TELEMETRY: 'false'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8055/server/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
volumes:
  directus11_database:
  directus11_uploads:
